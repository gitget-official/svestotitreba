# Deploy backenda (backend/Planiraj.API) na Azure Web App planiraj-api.
# Pokreće se samo kad se na main promijeni nešto u backend/ (ili ovaj fajl); testovi moraju proći prije deploya.
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.Net Core app to Azure Web App - planiraj-api

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/main_planiraj-api.yml'
  workflow_dispatch:

# Dva deploya nikad ne idu istovremeno; novi čeka da prethodni završi.
concurrency:
  group: deploy-planiraj-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Planiraj.sln --configuration Release

      - name: Test
        run: dotnet test Planiraj.sln --configuration Release --no-build

      - name: Publish API
        run: dotnet publish Planiraj.API/Planiraj.API.csproj --configuration Release --no-build --output ${{ runner.temp }}/api

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CFCA6102B1BB4F3FA794FC3DB28F5F26 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0B3F766E124E42CABDCA94D602F01A03 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4DB02FBFCB8540CB8F06FE0DC43A21A6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'planiraj-api'
          slot-name: 'Production'
          package: .
